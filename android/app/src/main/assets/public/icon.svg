<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="60%" stop-color="#0f1d36" />
      <stop offset="100%" stop-color="#0b1222" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090f1d" />
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2">
    <line x1="96" y1="0" x2="96" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="416" y1="0" x2="416" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>

  <!-- Glowing Outer Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-opacity="0.7" />

  <!-- Antenna -->
  <line x1="256" y1="146" x2="256" y2="96" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />
  <circle cx="256" cy="82" r="24" fill="#38bdf8" />
  <circle cx="249" cy="75" r="8" fill="#e0f2fe" />

  <!-- Side Ears / Bolts -->
  <rect x="92" y="210" width="34" height="72" rx="16" fill="#64748b" stroke="#cbd5e1" stroke-width="5" />
  <rect x="386" y="210" width="34" height="72" rx="16" fill="#64748b" stroke="#cbd5e1" stroke-width="5" />

  <!-- Robot Head -->
  <rect x="118" y="142" width="276" height="214" rx="54" fill="url(#bodyGrad)" stroke="#fef08a" stroke-width="8" />

  <!-- Visor Screen -->
  <rect x="148" y="176" width="216" height="122" rx="34" fill="url(#visorGrad)" stroke="#38bdf8" stroke-width="6" />

  <!-- Expressive Glowing Eyes -->
  <circle cx="212" cy="236" r="30" fill="url(#eyeGlow)" />
  <circle cx="203" cy="226" r="10" fill="#ffffff" />
  <circle cx="300" cy="236" r="30" fill="url(#eyeGlow)" />
  <circle cx="291" cy="226" r="10" fill="#ffffff" />

  <!-- Happy LED Smile -->
  <path d="M 224 276 Q 256 296 288 276" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" />

  <!-- Chest Spark Emblem -->
  <rect x="164" y="368" width="184" height="68" rx="26" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />
  <path d="M 264 380 L 236 406 L 256 406 L 248 426 L 278 398 L 258 398 Z" fill="#fde047" />
</svg>
