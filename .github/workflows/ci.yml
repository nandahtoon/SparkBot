name: SparkBot CI
on:
  pull_request:
  push:
    branches: [main, sb-02-baseline-ci-regression, integration/sb-08r]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify SparkBot project context
        run: node scripts/check-project-context.mjs
      - name: Install pinned Bun
        run: npm install --global bun@1.4.4
      - name: Locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Game regression tests
        if: ${{ !cancelled() }}
        run: node --import tsx --test src/game/*.test.ts tests/*.test.ts
      - name: Web build
        if: ${{ !cancelled() }}
        run: bun run build
      - name: Verify output
        if: ${{ !cancelled() }}
        run: test -s dist/index.html && test -s dist/manifest.webmanifest && test -s dist/sw.js
